<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="kimana-orange-main" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3800" />
    </linearGradient>
    <linearGradient id="kimana-orange-glow" x1="13" y1="6" x2="34" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>
  <!-- Background badge for crisp favicon legibility across dark and light browser tabs -->
  <rect width="40" height="40" rx="10" fill="#111118" />
  <!-- Left Pillar -->
  <rect x="6" y="6" width="6.5" height="28" rx="3.25" fill="url(#kimana-orange-main)" />
  <!-- Upper Arm -->
  <rect x="13" y="17.5" width="21" height="6.5" rx="3.25" fill="url(#kimana-orange-glow)" transform="rotate(-42 13 20.75)" />
  <!-- Lower Arm -->
  <rect x="13" y="15.75" width="21" height="6.5" rx="3.25" fill="#FFFFFF" transform="rotate(42 13 19)" />
</svg>